# Publishes a CI-built DMG to the beta-1 release. The DMG arrives as a signed
# artifact-zip URL (from a sidepiece Actions run); the runner downloads it and
# replaces the release asset with GITHUB_TOKEN - no PAT needed server-side.
name: publish-dmg

on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: Signed URL of the SidePiece-dmg artifact zip from a sidepiece Actions run
        required: true
        type: string
      build:
        description: SIDEPIECE_BUILD of the artifact being published
        required: true
        type: string
  repository_dispatch:
    types: [publish-dmg]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # repository_dispatch runs can materialize hours late or duplicated; a
      # stale publish once reverted the live release to an older build. Refuse
      # anything that is not newer than the manifest already on the release.
      - name: Skip stale or duplicate publishes
        env:
          PAYLOAD_BUILD: ${{ inputs.build || github.event.client_payload.build }}
        run: |
          set -euo pipefail
          test -n "${PAYLOAD_BUILD:-}" || { echo "payload carries no build number - refusing to publish"; exit 1; }
          LIVE="$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/beta-1/update.json?v=$RANDOM" | jq -r '.build // 0')" || LIVE=0
          echo "payload build $PAYLOAD_BUILD, live build ${LIVE:-0}"
          if [ "$PAYLOAD_BUILD" -le "${LIVE:-0}" ]; then
            echo "stale or duplicate publish - skipping"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - name: Download and unzip DMG
        if: env.SKIP_PUBLISH != '1'
        env:
          DMG_URL: ${{ inputs.dmg_url || github.event.client_payload.dmg_url }}
        run: |
          curl -fsSL -o /tmp/dmg.zip "$DMG_URL"
          unzip -o /tmp/dmg.zip -d /tmp/dmg
          ls -la /tmp/dmg
          shasum -a 256 /tmp/dmg/SidePiece.dmg

      - name: Replace beta-1 release assets (DMG first, then update.json)
        if: env.SKIP_PUBLISH != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload beta-1 /tmp/dmg/SidePiece.dmg --clobber -R ${{ github.repository }}
          if [ -f /tmp/dmg/update.json ]; then
            gh release upload beta-1 /tmp/dmg/update.json --clobber -R ${{ github.repository }}
          fi

